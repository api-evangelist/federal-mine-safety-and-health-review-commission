aid: federal-mine-safety-and-health-review-commission
name: Federal Mine Safety and Health Review Commission
description: >-
  The Federal Mine Safety and Health Review Commission (FMSHRC) is an independent
  United States adjudicative agency that provides administrative trial and appellate
  review of legal disputes arising under the Federal Mine Safety and Health Amendments
  Act of 1977 (the Mine Act). Its administrative law judges and its five-member
  Commission hear contests of the citations, orders and civil penalties issued by the
  Department of Labor's Mine Safety and Health Administration, along with miner
  discrimination complaints under section 105(c). FMSHRC does not regulate mining or
  enforce the Mine Act. It publishes decisions, dockets and Blue Book volumes as HTML
  and PDF on fmshrc.gov and runs a vendor-hosted electronic case management system for
  filing, but exposes no public API, developer program or machine-readable contract.
