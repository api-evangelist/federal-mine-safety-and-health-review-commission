  reason: no-developer-program
  detail: >-
    FMSHRC runs a Drupal 10 site with JSON:API and REST disabled — /jsonapi, /api, /rest,
    /graphql, /data.json and /openapi.json all return 404 and a node requested with
    ?_format=json returns HTTP 406 — and its only transactional surface, the e-CMS at
    fmshrc-ecms.entellitrak.com, is a vendor-hosted login form, so the agency publishes
    decisions as HTML and PDF and no programmable interface at all.
